apiVersion: v1
kind: Service
metadata:
  name: vllm
  namespace: llm-inference
  labels: {app.kubernetes.io/name: vllm}
  annotations:
    # If you use prefix-aware routing (see docs/05-k8s.md), requests that share
    # a system prompt should land on the same replica or the prefix cache gives
    # you nothing. Plain round-robin across replicas cuts the measured hit rate
    # roughly by 1/N — that is an infrastructure decision with a measurable
    # throughput cost, so make it deliberately.
    llm-inference/routing: round-robin
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: vllm}
  ports:
    - {name: http, port: 80, targetPort: http, protocol: TCP}
  # Session affinity is the poor-man's prefix-affinity knob: it pins a client IP
  # to a replica. Only useful when a single client sends many same-prefix
  # requests; harmful when you have few clients and need even load spreading.
  sessionAffinity: None
---
# Headless service so the load generator (and debugging) can address individual
# replicas and measure per-replica behaviour without the Service load balancer
# hiding which pod served what.
apiVersion: v1
kind: Service
metadata:
  name: vllm-headless
  namespace: llm-inference
  labels: {app.kubernetes.io/name: vllm}
spec:
  type: ClusterIP
  clusterIP: None
  selector: {app.kubernetes.io/name: vllm}
  ports:
    - {name: http, port: 8000, targetPort: http}
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-metrics
  namespace: llm-inference
  labels: {app.kubernetes.io/name: vllm}
spec:
  type: ClusterIP
  clusterIP: None
  selector: {app.kubernetes.io/name: vllm}
  ports:
    - {name: metrics, port: 8000, targetPort: http}
