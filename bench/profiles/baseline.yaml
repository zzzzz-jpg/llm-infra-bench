# ---------------------------------------------------------------------------
# BASELINE — the fixed reference load every experiment in this project must use.
# Do not edit this file once a result set exists; add a new profile instead.
# Every field below ends up in results/<run>/meta.json, so a run is always
# self-describing and reproducible.
# ---------------------------------------------------------------------------
loadgen:
  # --- target ------------------------------------------------------------
  base_url: "http://127.0.0.1:8000"
  model: ""                     # empty = auto-detect via GET /v1/models
  endpoint: "chat"              # chat | completions
  api_key: ""

  # --- the fixed workload (the "controlled" part of the experiment) -------
  input_len: 1024               # prompt tokens (exact when --tokenizer is set)
  output_len: 256               # completion tokens
  force_output_len: true        # -> ignore_eos=true, kills length variance
  min_input_len: 0              # 0 == fixed length; set < input_len for a uniform range
  min_output_len: 0
  num_requests: 300             # 0 -> run for duration_sec instead
  duration_sec: 0
  seed: 1234                    # prompt content + arrival jitter are seeded

  # --- load model --------------------------------------------------------
  mode: "open"                  # open = Poisson arrivals (rate-limited)
  request_rate: 4.0             # rps
  max_concurrency: 64           # in-flight safety valve
  warmup_requests: 8            # excluded from all statistics
  rampup_sec: 0

  # --- prompt construction ------------------------------------------------
  prompt_style: "lorem"
  shared_prefix_tokens: 0
  tokenizer: ""                 # e.g. "Qwen/Qwen2.5-7B-Instruct" -> exact token counts
  chars_per_token: 3.6          # heuristic used only when tokenizer is empty

  # --- server-side collection --------------------------------------------
  scrape_interval: 1.0
  metrics_endpoints:
    - "http://127.0.0.1:8000/metrics"          # vLLM / SGLang engine metrics
  gpu_metrics_endpoints:
    - "http://127.0.0.1:9400/metrics"          # dcgm-exporter (optional)
  record_itl: true
  timeout_sec: 600
  connect_timeout_sec: 30

  out_dir: "results"
  tag: "baseline"
  notes: "Reference load: in=1024 out=256 open-loop 4rps."
