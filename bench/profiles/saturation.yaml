# SATURATION SWEEP — closed-loop, concurrency is the independent variable.
# Run once per concurrency level (run_matrix.sh does this for you):
#   for C in 1 2 4 8 16 32 64 128; do
#     python3 loadgen.py --profile profiles/saturation.yaml \
#         --max-concurrency $C --tag sat-c$C
#   done
# Output: the throughput/latency knee -> max sustainable concurrency, which is
# the number the K8s HPA and the capacity model are built on.
loadgen:
  base_url: "http://127.0.0.1:8000"
  endpoint: "chat"

  input_len: 1024
  output_len: 256
  force_output_len: true
  num_requests: 160
  seed: 1234

  mode: "closed"            # N workers, zero think time -> true saturation
  max_concurrency: 16       # <-- overridden per run
  warmup_requests: 4
  rampup_sec: 0

  prompt_style: "lorem"
  tokenizer: ""
  chars_per_token: 3.6

  scrape_interval: 1.0
  metrics_endpoints: ["http://127.0.0.1:8000/metrics"]
  gpu_metrics_endpoints: ["http://127.0.0.1:9400/metrics"]
  record_itl: true

  out_dir: "results"
  tag: "saturation"
  notes: "Closed-loop concurrency sweep."
