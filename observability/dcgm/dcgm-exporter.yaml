# ---------------------------------------------------------------------------
# dcgm-exporter — GPU utilisation, VRAM, SM/tensor/DRAM activity, power,
# temperature and XID errors. Without it "GPU 利用率/显存" in the requirement
# list is guesswork: nvidia-smi in a sidecar gives you utilisation only and
# burns a CPU core doing it.
#
#   kubectl apply -f observability/dcgm/dcgm-exporter.yaml
#
# Requires the NVIDIA GPU Operator or the nvidia container runtime + driver on
# the node. Runs as a DaemonSet so every GPU node reports.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Namespace
metadata:
  name: gpu-monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dcgm-exporter-counters
  namespace: gpu-monitoring
data:
  # Only the fields an inference workload actually needs. The default counter
  # file has ~200 entries and will cost you cardinality for nothing.
  counters.txt: |
    DCGM_FI_DEV_GPU_UTIL,       gauge, GPU utilization (%)
    DCGM_FI_DEV_MEM_COPY_UTIL,  gauge, Memory copy utilization (%)
    DCGM_FI_DEV_FB_USED,        gauge, Framebuffer used (MiB)
    DCGM_FI_DEV_FB_FREE,        gauge, Framebuffer free (MiB)
    DCGM_FI_DEV_FB_TOTAL,       gauge, Framebuffer total (MiB)
    DCGM_FI_DEV_SM_CLOCK,       gauge, SM clock (MHz)
    DCGM_FI_DEV_MEM_CLOCK,      gauge, Memory clock (MHz)
    DCGM_FI_DEV_GPU_TEMP,       gauge, GPU temperature (C)
    DCGM_FI_DEV_POWER_USAGE,    gauge, Power draw (W)
    DCGM_FI_DEV_POWER_MGMT_LIMIT, gauge, Power management limit (W)
    DCGM_FI_DEV_PCIE_TX_THROUGHPUT, gauge, PCIe TX (KiB/s)
    DCGM_FI_DEV_PCIE_RX_THROUGHPUT, gauge, PCIe RX (KiB/s)
    DCGM_FI_DEV_NVLINK_BANDWIDTH_TOTAL, gauge, NVLink total bandwidth (KiB/s)
    DCGM_FI_DEV_XID_ERRORS,     gauge, XID error code
    DCGM_FI_DEV_ECC_SBE_VOL_TOTAL, counter, Single-bit ECC errors
    DCGM_FI_DEV_ECC_DBE_VOL_TOTAL, counter, Double-bit ECC errors
    DCGM_FI_PROF_GR_ENGINE_ACTIVE, gauge, Graphics engine activity
    DCGM_FI_PROF_SM_ACTIVE,     gauge, SM active ratio
    DCGM_FI_PROF_SM_OCCUPANCY,  gauge, SM occupancy
    DCGM_FI_PROF_PIPE_TENSOR_ACTIVE, gauge, Tensor core activity
    DCGM_FI_PROF_PIPE_FP16_ACTIVE, gauge, FP16 pipe activity
    DCGM_FI_PROF_DRAM_ACTIVE,   gauge, Device memory bandwidth utilization
    DCGM_FI_PROF_PCIE_TX_BYTES, gauge, PCIe TX bytes
    DCGM_FI_PROF_NVLINK_TX_BYTES, gauge, NVLink TX bytes
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: dcgm-exporter
  namespace: gpu-monitoring
  labels: {app: dcgm-exporter}
spec:
  selector:
    matchLabels: {app: dcgm-exporter}
  updateStrategy: {type: RollingUpdate}
  template:
    metadata:
      labels: {app: dcgm-exporter}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9400"
        prometheus.io/path: /metrics
    spec:
      priorityClassName: system-node-critical
      serviceAccountName: dcgm-exporter
      nodeSelector:
        # only schedule where the GPUs are
        nvidia.com/gpu.present: "true"
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: dcgm-exporter
          image: nvcr.io/nvidia/k8s/dcgm-exporter:3.3.9-3.6.0-ubuntu22.04
          args:
            - -f
            - /etc/dcgm-exporter/counters.txt
            - --web-listen-address
            - 0.0.0.0:9400
            # -k lets DCGM talk to the kubelet so every series carries
            # pod/namespace labels — that is what makes "which replica is on
            # the hot GPU" answerable.
            - -k
            - https://kubernetes.default.svc:443
            - --kube-pod-resources-socket
            - /var/lib/kubelet/pod-resources/kubelet.sock
          ports:
            - {name: metrics, containerPort: 9400}
          securityContext:
            capabilities:
              add: [SYS_ADMIN]      # required for profiling metrics (DCGM_FI_PROF_*)
            runAsNonRoot: false
            runAsUser: 0
          env:
            - name: DCGM_EXPORTER_LISTEN
              value: "0.0.0.0:9400"
          volumeMounts:
            - {name: dev, mountPath: /dev}
            - {name: counters, mountPath: /etc/dcgm-exporter/counters.txt, subPath: counters.txt}
            - {name: pod-resources, mountPath: /var/lib/kubelet/pod-resources}
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits:   {cpu: 200m, memory: 256Mi}
          livenessProbe:
            httpGet: {path: /metrics, port: 9400}
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - {name: dev, hostPath: {path: /dev}}
        - {name: counters, configMap: {name: dcgm-exporter-counters}}
        - {name: pod-resources, hostPath: {path: /var/lib/kubelet/pod-resources}}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: dcgm-exporter, namespace: gpu-monitoring}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: dcgm-exporter}
rules:
  - apiGroups: [""]
    resources: [nodes, pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: dcgm-exporter}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: dcgm-exporter}
subjects:
  - {kind: ServiceAccount, name: dcgm-exporter, namespace: gpu-monitoring}
---
apiVersion: v1
kind: Service
metadata:
  name: dcgm-exporter
  namespace: gpu-monitoring
  labels: {app: dcgm-exporter}
spec:
  selector: {app: dcgm-exporter}
  ports:
    - {name: metrics, port: 9400, targetPort: 9400}
